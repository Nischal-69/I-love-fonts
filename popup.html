<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Love Fonts – Font Finder</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="brand">
      <div class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><text x="11" y="17" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="800" fill="#FFFFFF">Aa</text><circle cx="18.5" cy="5.5" r="3" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.2"/></svg></div>
      <div class="brand-text">
        <h1>I Love Fonts</h1>
        <p class="tagline">Find any font instantly.</p>
      </div>
      <span class="version">v0.1.0</span>
    </header>

    <main class="main">
      <button id="activateBtn" class="primary-btn" type="button">
        <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
        <span>Activate Font Finder</span>
      </button>
      <p id="statusMessage" class="status" role="status">Hover any text to identify it.</p>

      <section class="block">
        <div class="block-head">
          <h2>Last detected</h2>
        </div>
        <div id="lastFont" class="last-font">
          <p class="empty-text">No fonts inspected yet.</p>
        </div>
      </section>

      <section class="block">
        <div class="block-head">
          <h2>Recent</h2>
          <button id="clearHistoryBtn" class="link-btn" type="button">Clear</button>
        </div>
        <ul id="historyList" class="history-list">
          <li class="empty-text">No history yet.</li>
        </ul>
      </section>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
